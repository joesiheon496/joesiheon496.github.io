baseURL = "https://joesiheon496.github.io/"
defaultContentLanguage = "ko"
title = "시헌의 정리 노트"
theme = ["github.com/adityatelange/hugo-PaperMod"]

enableRobotsTXT = true
enableEmoji = true
paginate = 10

# --- Hugo Modules: PaperMod (git submodule 대신 모듈로 관리) ---
[module]
  [[module.imports]]
    path = "github.com/adityatelange/hugo-PaperMod"

# --- 코드 블록 syntax highlighting (Chroma, 클래스 기반) ---
[markup]
  [markup.highlight]
    noClasses = false
    codeFences = true
    guessSyntax = true
    lineNos = false
    tabWidth = 2

  # --- 수식(KaTeX) 통과 처리 ---
  # 이걸 켜지 않으면 Goldmark 가 LaTeX 의 밑줄을 이탤릭으로 해석해 수식이 조용히 깨진다.
  # 인라인은 \(...\) 이고 $...$ 가 아니다 — $ 를 쓰면 기존 글의 달러 표기가 수식으로 잡힌다.
  [markup.goldmark]
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.passthrough]
        enable = true
        [markup.goldmark.extensions.passthrough.delimiters]
          block = [['\[', '\]'], ['$$', '$$']]
          inline = [['\(', '\)']]

# --- PaperMod 파라미터 ---
[params]
  env = "production"
  defaultTheme = "auto"        # light/dark 자동
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowToc = true
  TocOpen = false
  comments = true              # giscus 렌더링 트리거

  [params.homeInfoParams]
    Title = "시헌의 정리 노트"
    Content = "논문과 프로그램을 정리하는 공간입니다."

  # --- 파비콘/아이콘 (static/ 에 파일 위치) ---
  [params.assets]
    favicon = "/favicon.ico"
    favicon16x16 = "/favicon-16x16.png"
    favicon32x32 = "/favicon-32x32.png"
    apple_touch_icon = "/apple-touch-icon.png"

  # --- giscus 댓글 (placeholder — 나중에 채우기) ---
  [params.giscus]
    repo = "joesiheon496/joesiheon496.github.io"
    repoId = "REPLACE_WITH_REPO_ID"
    category = "Announcements"
    categoryId = "REPLACE_WITH_CATEGORY_ID"
    mapping = "pathname"
    reactionsEnabled = "1"
    emitMetadata = "0"
    inputPosition = "bottom"
    lang = "ko"

# --- 메뉴 ---
[[menu.main]]
  identifier = "posts"
  name = "글"
  url = "/posts/"
  weight = 10
[[menu.main]]
  identifier = "tags"
  name = "태그"
  url = "/tags/"
  weight = 20

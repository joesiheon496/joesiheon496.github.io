{{/* 한글 폰트 Pretendard 적용 (extend_head.html 훅) */}}
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" as="style" crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root {
    --pretendard: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont,
      system-ui, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", "Segoe UI", Roboto, sans-serif;
  }
  body,
  .post-content,
  .post-title,
  .entry-header,
  .first-entry,
  h1, h2, h3, h4, h5, h6 {
    font-family: var(--pretendard);
  }
</style>

{{/* KaTeX — front matter 에 math = true 인 글에서만 로드한다.
     delimiters 는 hugo.toml 의 passthrough 설정과 정확히 일치해야 한다.
     SRI 해시는 0.18.1 기준이며 실제로 sha384 를 계산해 확인했다. */}}
{{ if .Param "math" }}
<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/katex@0.18.1/dist/katex.min.css"
      integrity="sha384-1vdNCNel6Tx/NQa8IR1mGOGKsbGreCkOPfbtPPnUURJ5Tu2PRVfQ/7KLZC+Pi1p1"
      crossorigin="anonymous">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.18.1/dist/katex.min.js"
        integrity="sha384-ycJ6GAwiS15LoUPipwJOrWTvkUHl/YqELValBwI5I4awP1EeEQJYarj+w85ntcz7"
        crossorigin="anonymous"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.18.1/dist/contrib/auto-render.min.js"
        integrity="sha384-bjyGPfbij8/NDKJhSGZNP/khQVgtHUE5exjm4Ydllo42FwIgYsdLO2lXGmRBf5Mz"
        crossorigin="anonymous"
        onload="renderMathInElement(document.body, {
          delimiters: [
            {left: '$$', right: '$$', display: true},
            {left: '\\[', right: '\\]', display: true},
            {left: '\\(', right: '\\)', display: false}
          ],
          throwOnError: false
        });"></script>
{{ end }}
